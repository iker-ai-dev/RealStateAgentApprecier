name: Deploy RetailScope

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

permissions:
  contents: read

jobs:
  test:
    name: Test app and MCP server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compile Python
        run: |
          python -m py_compile \
            streamlit_app.py \
            snowflake_streamlit_app.py \
            app/agent_api.py \
            app/mcp_server.py \
            app/data_access.py \
            app/observability.py \
            app/services/cortex.py \
            app/services/valuation.py

      - name: Smoke test app data path
        run: |
          python - <<'PY'
          from app.agent_api import appraise_property, list_properties

          properties = list_properties()
          assert properties, "expected sample properties"
          result = appraise_property(properties[0]["property_id"])
          assert result["valuation"]["blended_value"] > 0
          print("smoke ok")
          PY

      - name: Run offline integration tests
        run: python -m unittest discover -s tests -v

  deploy-render:
    name: Deploy public app and MCP to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: retailscope-render-production
      cancel-in-progress: false
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Deploy tested commit
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          status=$(curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 30 --request POST \
            --output /dev/null --write-out '%{http_code}' \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          case "$status" in
            200|202) echo "Render accepted deploy of tested commit ${GITHUB_SHA}." ;;
            *) echo "::error::Render rejected deployment (HTTP ${status})."; exit 1 ;;
          esac

  deploy:
    name: Deploy to Snowflake
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: retailscope-snowflake-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check Snowflake deploy secrets
        id: snowflake-secrets
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          missing=""
          for name in \
            SNOWFLAKE_ACCOUNT \
            SNOWFLAKE_USER \
            SNOWFLAKE_ROLE \
            SNOWFLAKE_WAREHOUSE \
            SNOWFLAKE_DATABASE \
            SNOWFLAKE_SCHEMA
          do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -z "$SNOWFLAKE_PASSWORD" ] && [ -z "$SNOWFLAKE_PRIVATE_KEY" ]; then
            missing="$missing SNOWFLAKE_PRIVATE_KEY (or SNOWFLAKE_PASSWORD)"
          fi

          if [ -n "$missing" ]; then
            echo "::notice::Skipping Snowflake deploy; missing GitHub Actions secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Snowflake CLI
        if: steps.snowflake-secrets.outputs.ready == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install snowflake-cli==3.29.0

      - name: Deploy Streamlit app
        if: steps.snowflake-secrets.outputs.ready == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          auth_args=()
          if [ -n "$SNOWFLAKE_PRIVATE_KEY" ]; then
            key_file="$RUNNER_TEMP/retailscope-key.p8"
            umask 077
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
            trap 'rm -f "$key_file"' EXIT
            auth_args=(--authenticator SNOWFLAKE_JWT --private-key-file "$key_file")
          else
            auth_args=(--password "$SNOWFLAKE_PASSWORD")
          fi
          snow streamlit deploy retailscope_ai \
            --replace \
            --temporary-connection \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            "${auth_args[@]}" \
            --role "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database "$SNOWFLAKE_DATABASE" \
            --schema "$SNOWFLAKE_SCHEMA"

      - name: Print app URL
        if: steps.snowflake-secrets.outputs.ready == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
        run: |
          auth_args=()
          if [ -n "$SNOWFLAKE_PRIVATE_KEY" ]; then
            key_file="$RUNNER_TEMP/retailscope-key.p8"
            umask 077
            printf '%s' "$SNOWFLAKE_PRIVATE_KEY" > "$key_file"
            trap 'rm -f "$key_file"' EXIT
            auth_args=(--authenticator SNOWFLAKE_JWT --private-key-file "$key_file")
          else
            auth_args=(--password "$SNOWFLAKE_PASSWORD")
          fi
          snow streamlit get-url STREAMLIT_APP \
            --temporary-connection \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            "${auth_args[@]}" \
            --role "$SNOWFLAKE_ROLE" \
            --warehouse "$SNOWFLAKE_WAREHOUSE" \
            --database "$SNOWFLAKE_DATABASE" \
            --schema "$SNOWFLAKE_SCHEMA"
