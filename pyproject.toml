[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retailscope-ai"
version = "0.1.0"
description = "RetailScope AI shopping-center underwriting app and MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=5.3",
    "mcp>=1.16,<2",
    "pandas>=2.2",
    "sentry-sdk>=2.22",
    "snowflake-connector-python>=3.12",
    "snowflake-snowpark-python>=1.23",
    "streamlit>=1.38",
]

[project.scripts]
retailscope-mcp = "app.mcp_server:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["data/*.csv"]
