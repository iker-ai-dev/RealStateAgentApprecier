worker_processes 1;
pid /tmp/retailscope-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map __CLIENT_IP_SOURCE__ $public_client_ip {
        '' $remote_addr;
        default __CLIENT_IP_SOURCE__;
    }
    limit_req_zone $public_client_ip zone=mcp_limit:1m rate=20r/s;
    server {
        listen __PORT__;
        location = /mcp {
            client_max_body_size 64k;
            limit_req zone=mcp_limit burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:__MCP_PORT__;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location = /healthz {
            proxy_pass http://127.0.0.1:__HEALTH_PORT__/healthz;
        }
        location /api/ {
            client_max_body_size 16k;
            limit_req zone=mcp_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $public_client_ip;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 180s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400s;
            proxy_buffering off;
        }
    }
}
